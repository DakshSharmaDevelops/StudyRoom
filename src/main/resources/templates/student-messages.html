<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ask your tutor — Studyroom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body class="management-page">
<header class="management-topbar">
    <a class="brand" th:href="@{/student}"><span class="brand-mark"><span></span><span></span><span></span><span></span></span><span>studyroom<span class="brand-period">.</span></span></a>
    <nav><a th:href="@{/student}">My classroom</a><a class="selected" th:href="@{/student/messages}">Ask your tutor</a></nav>
    <form th:action="@{/logout}" method="post"><button class="logout-button" type="submit">Log out</button></form>
</header>
<main class="management-content">
    <a class="back-link" th:href="@{/student}">← Back to my classroom</a>
    <div class="eyebrow"><span class="eyebrow-line"></span> PRIVATE CONVERSATION</div>
    <h1>Ask your <span>tutor.</span></h1>
    <p class="welcome-subtitle">Only you and your tutor can see this conversation.</p>
    <div class="notice notice-error" th:if="${error}" th:text="${error}"></div>
    <section class="conversation-card">
        <div class="conversation-empty" th:if="${#lists.isEmpty(messages)}">Your conversation starts here. Ask your tutor anything about class.</div>
        <div class="message-list">
            <article class="message-bubble" th:each="message : ${messages}" th:classappend="${message.sender.id == student.id ? ' message-own' : ''}">
                <div class="message-meta"><strong th:text="${message.sender.id == student.id ? 'You' : 'Your tutor'}">You</strong><time th:text="${#temporals.format(message.createdAt, 'MMM d · h:mm a')}">Today</time></div>
                <p th:text="${message.body}">Message</p>
            </article>
        </div>
        <form class="message-form" th:action="@{/student/messages}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label class="visually-hidden" for="student-message">Your question</label>
            <textarea id="student-message" name="body" maxlength="2000" rows="3" placeholder="Write your question…" required></textarea>
            <div class="message-form-footer"><span>Your message is private · 2,000 characters max</span><button class="button button-primary" type="submit">Send message →</button></div>
        </form>
    </section>
</main>
</body>
</html>
