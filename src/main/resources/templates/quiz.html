<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${quiz.title + ' — Studyroom'}">Quiz — Studyroom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body class="management-page">
<header class="management-topbar">
    <a class="brand" th:href="@{/student}"><span class="brand-mark"><span></span><span></span><span></span><span></span></span><span>studyroom<span class="brand-period">.</span></span></a>
    <nav><a th:href="@{/student}">My classroom</a><a class="selected" th:href="@{/student/quizzes}">Quizzes</a><a th:href="@{/student/messages}">Ask your tutor</a></nav>
    <form th:action="@{/logout}" method="post"><button class="logout-button" type="submit">Log out</button></form>
</header>
<main class="management-content quiz-taking-page">
    <a class="back-link" th:href="@{/student/quizzes}">← Back to quizzes</a>
    <div class="eyebrow"><span class="eyebrow-line"></span><span th:text="${quiz.topic}">Topic</span></div>
    <h1 th:text="${quiz.title}">Quiz title</h1>
    <p class="welcome-subtitle" th:text="${#lists.size(quiz.questions) + ' multiple-choice questions'}">Questions</p>
    <div class="notice notice-error" th:if="${error}" th:text="${error}"></div>
    <form class="quiz-taking-form" th:action="@{/student/quizzes/{id}(id=${quiz.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <fieldset class="quiz-question-card" th:each="question, questionStat : ${quiz.questions}">
            <legend><span th:text="${'QUESTION ' + (questionStat.index + 1)}">QUESTION</span></legend>
            <h2 th:text="${question.prompt}">Question prompt</h2>
            <label class="answer-option" th:each="option, optionStat : ${question.options}">
                <input type="radio" name="answers" th:value="${optionStat.index}" required>
                <span class="answer-letter" th:text="${'ABCD'.substring(optionStat.index, optionStat.index + 1)}">A</span>
                <span th:text="${option}">Answer</span>
            </label>
        </fieldset>
        <button class="button button-primary quiz-submit" type="submit">Submit answers →</button>
    </form>
</main>
</body>
</html>
