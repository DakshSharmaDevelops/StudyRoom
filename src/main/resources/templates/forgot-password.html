<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f8f5">
    <title>Forgot password — Studyroom</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <a class="brand auth-brand" th:href="@{/login}">
        <span class="brand-mark"><span></span><span></span><span></span><span></span></span>
        <span>studyroom<span class="brand-period">.</span></span>
    </a>
    <div class="eyebrow"><span class="eyebrow-line"></span> ACCOUNT RECOVERY</div>
    <h1>Forgot your <span>password?</span></h1>
    <p class="auth-intro">Enter your teacher username. If it has a recovery email, we will send a one-time code valid for 10 minutes.</p>
    <div class="notice notice-success" th:if="${notice}" th:text="${notice}"></div>
    <form class="auth-form" th:action="@{/forgot-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="username">Teacher username</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
        <button class="button button-primary auth-submit" type="submit">Send reset code <span>→</span></button>
    </form>
    <p class="auth-footnote"><a th:href="@{/reset-password}">I already have a reset code</a> · <a th:href="@{/login}">Back to sign in</a></p>
</main>
</body>
</html>
