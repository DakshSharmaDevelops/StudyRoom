<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f8f5">
    <title>Reset password — Studyroom</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body class="auth-page">
<main class="auth-card">
    <a class="brand auth-brand" th:href="@{/login}">
        <span class="brand-mark"><span></span><span></span><span></span><span></span></span>
        <span>studyroom<span class="brand-period">.</span></span>
    </a>
    <div class="eyebrow"><span class="eyebrow-line"></span> ACCOUNT RECOVERY</div>
    <h1>Choose a new <span>password.</span></h1>
    <p class="auth-intro">Enter your teacher username, the six-digit email code, and a new password.</p>
    <div class="notice notice-error" th:if="${error}" th:text="${error}"></div>
    <form class="auth-form" th:action="@{/reset-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="username">Teacher username</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
        <label for="code">Email code</label>
        <input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required>
        <label for="password">New password (at least 12 characters)</label>
        <input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required>
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" minlength="12" autocomplete="new-password" required>
        <button class="button button-primary auth-submit" type="submit">Reset password <span>→</span></button>
    </form>
    <p class="auth-footnote"><a th:href="@{/forgot-password}">Request a new code</a> · <a th:href="@{/login}">Back to sign in</a></p>
</main>
</body>
</html>
