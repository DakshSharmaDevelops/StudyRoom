spring.application.name=KrishanTutionCenter
spring.config.import=optional:file:.env[.properties]
spring.thymeleaf.cache=false
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/studyroom}
spring.datasource.username=${DATABASE_USERNAME:studyroom}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=501MB
spring.servlet.multipart.max-request-size=502MB
app.upload-dir=${APP_UPLOAD_DIR:./data/uploads}
app.storage.endpoint=${STORAGE_ENDPOINT:}
app.storage.region=${STORAGE_REGION:us-east-1}
app.storage.bucket=${STORAGE_BUCKET:}
app.storage.access-key=${STORAGE_ACCESS_KEY:}
app.storage.secret-key=${STORAGE_SECRET_KEY:}
app.video-max-bytes=${VIDEO_MAX_BYTES:524288000}
app.ai.api-key=${GEMINI_API_KEY:}
app.ai.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
app.ai.monthly-request-limit=${AI_MONTHLY_REQUEST_LIMIT:100}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:25}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.password-reset.from=${MAIL_FROM:${MAIL_USERNAME:}}
